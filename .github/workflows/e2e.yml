# E2E on an ephemeral Neon branch.
#
# Why this exists: the 2026-07-11 retrospective found the running-server e2e
# suite is the SOLE defense for the dominant bug class (runtime/framework
# defects invisible to unit tests) — yet it never ran in CI. This job closes
# that gap using the stack's own advertised capability: Neon branching.
#
# Until 2026-09-26 this job could not actually have passed even with the two
# secrets configured (test-coverage review 2026-09-25, C-5): it never wrote
# PLATFORM_DATABASE_URL (globalSetup throws), it ran `db:push` + `db:seed`
# only (Drizzle Kit emits none of the hand-written RLS/trigger migrations, so
# the branch would have no isolation model), and it never applied
# scripts/seed-dev.sql (specs reference fixture orgs like alder-creek that
# only exist after that file runs). This rewrite shares the same
# database-provisioning recipe as db.yml via the neon-ci-db composite action
# — one recipe, not two hand-maintained copies that drift from each other,
# which is exactly how C-5 happened in the first place.
#
# Required repository secrets (skips cleanly when absent, so forks work out of
# the box before wiring Neon):
#   NEON_API_KEY      — console.neon.tech -> Account settings -> API keys
#   NEON_PROJECT_ID   — Neon project -> Settings -> General
#
# Everything else (AUTH_SECRET, TOTP key, seeded-user credentials) is generated
# per-run — the branch is created fresh and deleted afterward, so no live
# credentials are involved. Free-tier friendly: one branch per run, deleted in
# an always() step. No Real Data: see db.yml's header and DECISION-150 — the
# ephemeral branch forks the pinned `development` branch, but the job creates
# a fresh database inside it and never opens the parent's own `neondb`.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two parallel lanes (2026-10-23), each on its OWN ephemeral branch: `dev`
# (the Playwright suite against `next dev`) and `prod` (the hydration specs
# against `next build && next start`). They used to be two steps of one job;
# the production build then ran on a workspace the dev server had just used and
# failed, and the lanes' wall times added up. Separate jobs make each lane's
# failure its own evidence and each re-runnable alone.
#
# The dev lane is split into four `--shard=i/4` jobs (2026-11-01), each on its
# own ephemeral branch, the way db.yml shards vitest. One worker per shard
# still (playwright.config.ts: specs share fixture rows), so a shard is the
# same serial run over a quarter of the spec files. Unsharded it reached ~67
# min of test time on one runner and hit the job limit on PR #73 and the PR
# #70 merge run with no failing spec.

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: neon secrets present?
    runs-on: ubuntu-latest
    outputs:
      has-neon: ${{ steps.check.outputs.has-neon }}
    steps:
      - id: check
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$NEON_API_KEY" ]; then
            echo "has-neon=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-neon=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NEON_API_KEY not configured — e2e skipped. See workflow header for setup."
          fi

  e2e:
    name: playwright (${{ matrix.label }})
    needs: check-secrets
    if: needs.check-secrets.outputs.has-neon == 'true'
    runs-on: ubuntu-latest
    # Per shard. A dev shard is ~17 min of tests plus ~8 min of setup; the limit
    # leaves room for a slow runner without hiding a hung one for an hour.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: dev, shard: 1, label: "dev lane 1/4" }
          - { lane: dev, shard: 2, label: "dev lane 2/4" }
          - { lane: dev, shard: 3, label: "dev lane 3/4" }
          - { lane: dev, shard: 4, label: "dev lane 4/4" }
          - { lane: prod, shard: 0, label: "prod lane" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Provision ephemeral database
        id: db
        uses: ./.github/actions/neon-ci-db
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: development
          branch_name: e2e-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}-s${{ matrix.shard }}
          compute_cu: "2"

      # Deliberately does NOT also set the four DB URLs as step-level `env:`
      # on any `npm run` step below - dotenv -e .env.local does not override
      # an already-exported variable (Batch A finding, docs/work-log/
      # 2026-09-26-ci-db-tests.md). The `psql` steps are the legitimate
      # exception: psql has no dotenv integration and reads env: directly.
      - name: Write .env.local (per-run credentials, ephemeral DB)
        run: |
          set -euo pipefail
          {
            echo "DATABASE_URL=${{ steps.db.outputs.database_url }}"
            echo "APP_DATABASE_URL=${{ steps.db.outputs.app_database_url }}"
            echo "PLATFORM_DATABASE_URL=${{ steps.db.outputs.platform_database_url }}"
            echo "MIGRATE_DATABASE_URL=${{ steps.db.outputs.migrate_database_url }}"
            # F113 (2026-09-28-presbytery-e2e): without this, globalSetup's
            # runDbIsolationGuard() (e2e/support/global-setup.ts) parses
            # DATABASE_URL, sees a *.neon.tech host, sees CI=true, and hard-
            # throws. The branch was created fresh for THIS run and is deleted
            # in the always() step below; this is the guard's own Option A
            # ("a dedicated Neon branch connection string"), preferred over
            # E2E_ALLOW_SHARED_DB=true, which would suppress the guard for a
            # genuinely shared URL later.
            echo "E2E_DATABASE_URL=${{ steps.db.outputs.app_database_url }}"
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "AUTH_URL=http://localhost:3000"
            echo "AUTH_TRUST_HOST=true"
            echo "AUTH_TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            # This is the ONE place RATE_LIMIT_DISABLED=true belongs in CI:
            # the shared e2e fixture signs in far more than 5/min. db-tests
            # deliberately does NOT set this - it is where the limiter is
            # exercised for real.
            echo "RATE_LIMIT_DISABLED=true"
            # No SEED_* users here: the e2e suite provisions its own fixture
            # users from e2e/support/users.ts.
          } >> .env.local

      - run: npm run db:migrate
      - run: npm run check:schema-parity
      - run: npm run db:seed

      - name: Apply the synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/seed-dev.sql
        env:
          MIGRATE_DATABASE_URL: ${{ steps.db.outputs.migrate_database_url }}

      # The seeded flags are the go-live posture (mostly OFF); the suite was
      # written against a branch where a few were already ON. See the file's
      # own header.
      - name: Apply the e2e baseline flags
        shell: bash
        run: |
          set -euo pipefail
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/e2e-baseline-flags.sql
        env:
          MIGRATE_DATABASE_URL: ${{ steps.db.outputs.migrate_database_url }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite (dev server)
        if: matrix.lane == 'dev'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          CI: "true"

      # DECISION-159: the pre-hydration regression against a production build
      # (next build && next start, port 3800, never a reused server). Traces go
      # to test-results-prod/.
      - name: Run hydration specs against a production build
        if: matrix.lane == 'prod'
        timeout-minutes: 20
        run: npm run test:e2e:prod
        env:
          CI: "true"
          PW_OUTPUT_DIR: test-results-prod

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.lane }}-s${{ matrix.shard }}
          path: |
            test-results/
            test-results-prod/
          retention-days: 7
          if-no-files-found: ignore

      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: e2e-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}-s${{ matrix.shard }}
