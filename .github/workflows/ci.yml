name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build needs these to resolve, but no live data is hit.
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-secret-do-not-use-in-prod"
          AUTH_URL: "http://localhost:3000"
          AUTH_TOTP_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

      - name: Tripwire checks (audit-log invariant + sql-date)
        run: npm run check

      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      # Runs LAST, not third: a lint failure must never again hide Build/
      # Tripwires/Dependency audit/Unit tests behind a `skipped` status, which
      # is exactly what happened on every push to main from 2026-08-26 to
      # 2026-09-25 while Lint sat third with the job's default
      # continue-on-error: false. Every step above still reports its own true
      # pass/fail independent of Lint's outcome; the job's overall conclusion
      # still correctly goes red on a real lint failure.
      - name: Lint
        run: npm run lint

  # The commit-msg hook only runs where `npm install` has installed it — GitHub
  # web edits and fresh clones bypass it silently. This job re-validates every
  # PR commit with the same exported validator the hook uses.
  commit-grammar:
    name: commit grammar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Validate commit messages
        run: node scripts/validate-commit-range.mjs "origin/${{ github.base_ref }}..HEAD"
